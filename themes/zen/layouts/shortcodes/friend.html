{{ if .Get "url" }}
<a href={{ .Get "url" }} class="archive-item links-item">
    <img loading="lazy" class="archive-list-image" src={{ .Get "src" }}>
    <span class="links-body">
        <span class="links-name">{{ .Get "name" }}</span>
        <span class="links-meta">{{- if .Get "des" -}}{{- .Get "des" -}}{{- else -}}{{- .Get "url" -}}{{- end -}}</span>
    </span>
</a>
{{ end }}
