{{- $wm := site.Params.webmention -}}
{{- $endpoint := printf "https://webmention.io/%s/webmention" $wm.username -}}
<section id="webmentions" class="webmentions" data-target="{{ .Permalink }}">
  <h2 class="wm-title">Webmentions <span class="wm-count" hidden></span></h2>
  <p class="wm-intro">其他网站对本文的回复、转发、点赞和提及会显示在这里。</p>
  <div class="wm-status" role="status">正在加载 Webmentions…</div>
  <div class="wm-reactions"></div>
  <div class="wm-list"></div>

  <details class="wm-send">
    <summary>通过你的网站回应本文</summary>
    <p>在你的网站发布一篇包含本文链接的文章，然后在这里提交文章地址。</p>
    <form action="{{ $endpoint }}" method="post" accept-charset="UTF-8">
      <label for="wm-source">你的文章地址</label>
      <div class="wm-form-row">
        <input id="wm-source" name="source" type="url" placeholder="https://example.com/your-post/" required>
        <input type="hidden" name="target" value="{{ .Permalink }}">
        <button type="submit">发送 Webmention</button>
      </div>
    </form>
  </details>
</section>
{{- $webmentionsjs := resources.Get "js/webmentions.js" | resources.Minify }}
<script src="{{ $webmentionsjs.RelPermalink }}"></script>
<script>
  window.SiteWebmentions.init({
    el: '#webmentions',
    target: {{ .Permalink | jsonify }},
    api: 'https://webmention.io/api/mentions.jf2'
  });
</script>
