{{- /* 自建评论前端（SiteComments）
     数据仍存于 Waline 服务端（https://waline-comments.isming.me），
     前端只调 /api/comment，支持展示 / 发布 / 回复，
     无登录、无注册、无点赞。
     JS：assets/js/comments.js
     CSS：assets/css/common/comments.css（随 common/*.css 自动合并进全站样式） */ -}}
<p id="commentsanchor"></p>
<h2 class="comments-title">评论</h2>
<div id="comments" class="comments"></div>
{{- $commentsjs := resources.Get "js/comments.js" | resources.Minify }}
<script src="{{ $commentsjs.RelPermalink }}"></script>
<script>
  window.SiteComments.init({
    el: '#comments',
    serverURL: 'https://waline-comments.isming.me',
    path: window.location.pathname
  });
</script>
